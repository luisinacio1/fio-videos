# Todo domingo: o Claude repõe o banco de temas (diario/banco/temas.json) pesquisando na web, com fonte em cada fato.
# Só salva se o banco passar na conferência.
name: Banco de temas (semanal)

on:
  schedule:
    # domingo, 9h17 em Brasília
    - cron: "17 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: banco-semanal
  cancel-in-progress: false

jobs:
  banco:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dependências
        run: |
          npm ci
          npm install -g @anthropic-ai/claude-code

      - name: Repõe o banco
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FIO_SUPABASE_SERVICE_KEY: ${{ secrets.FIO_SUPABASE_SERVICE_KEY }}
        run: |
          export CLAUDE_CODE_OAUTH_TOKEN=$(printf %s "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')
          export FIO_SUPABASE_SERVICE_KEY=$(printf %s "$FIO_SUPABASE_SERVICE_KEY" | tr -d '[:space:]')
          claude -p "Siga a rotina em diario/BANCO.md" \
            --dangerously-skip-permissions \
            --max-turns 300 \
            --output-format text

      - name: Confere o banco
        run: node scripts/motor/banco.mjs conferir

      - name: Salva o banco
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diario/banco/
          if git diff --cached --quiet; then
            echo "Banco sem mudança"
            exit 0
          fi
          git commit -m "banco: reposição de $(TZ=America/Sao_Paulo date +%F)"
          git pull --rebase
          git push
